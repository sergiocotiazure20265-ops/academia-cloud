name: Publicar Academia Cloud na Azure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar site estático
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Publicar no Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.NOME_DO_SECRET_EXISTENTE }}

          action: "upload"

          # Pasta que contém o index.html
          app_location: "/"

          # Este projeto não possui API
          api_location: ""

          # Os arquivos já estão prontos para publicação
          output_location: ""

          # Não executar compilação com Node.js/Oryx
          skip_app_build: true
